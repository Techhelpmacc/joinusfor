<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Us For — RSVP</title>
<link rel="stylesheet" href="/assets/admin.css">
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background: var(--bg); }
  .rsvp-container { max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
  .rsvp-header { text-align: center; margin-bottom: 2rem; }
  .rsvp-logo { font-size: 1.15rem; font-weight: 600; color: var(--accent); margin-bottom: 1rem; }
  .rsvp-title { font-size: 1.4rem; font-weight: 600; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
  .rsvp-subtitle { color: var(--muted); margin: 0; font-size: 0.95rem; }
  .wedding-info { background: var(--card); padding: 1.5rem; border-radius: var(--radius); margin-bottom: 1.5rem; }
  .wedding-couple { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
  .wedding-date { color: var(--muted); font-size: 0.95rem; }
  .rsvp-form { background: var(--card); padding: 1.5rem; border-radius: var(--radius); }
  .form-section { margin-bottom: 1.5rem; }
  .form-section:last-child { margin-bottom: 0; }
  .form-section-title { font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 1rem; }
  .guest-list { margin-bottom: 1.5rem; }
  .guest-row { padding: 1rem; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 0.75rem; background: var(--bg); }
  .guest-name { font-weight: 600; margin-bottom: 0.5rem; }
  .guest-status { display: flex; gap: 0.75rem; margin-top: 0.75rem; }
  .guest-status label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer; }
  .guest-status input { cursor: pointer; }
  .meal-choice { margin-top: 0.75rem; }
  .meal-choice select { width: 100%; }
  .dietary { margin-top: 0.75rem; }
  .dietary textarea { width: 100%; min-height: 3rem; padding: 0.75rem; border: 1px solid var(--line); border-radius: 4px; font-family: inherit; font-size: 0.95rem; }
  .form-actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
  .form-actions button { flex: 1; }
  .loading { text-align: center; padding: 2rem; color: var(--muted); }
  .error { background: var(--danger-soft); color: var(--danger); padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem; }
</style>
</head>
<body>

<div class="rsvp-container">
  <div class="rsvp-header">
    <div class="rsvp-logo">💌 Join Us For</div>
    <h1 class="rsvp-title">RSVP</h1>
    <p class="rsvp-subtitle" id="headerSubtitle">Loading your invitation…</p>
  </div>

  <div id="errorMsg" class="error" style="display: none;"></div>

  <div id="loadingView" class="loading">
    <p>Loading your invitation details…</p>
  </div>

  <div id="contentView" style="display: none;">
    <div class="wedding-info">
      <div class="wedding-couple" id="weddingCouple">—</div>
      <div class="wedding-date" id="weddingDate">—</div>
    </div>

    <form id="rsvpForm" class="rsvp-form">
      <div class="form-section">
        <div class="form-section-title">Your RSVP</div>
        <div class="guest-list" id="guestList"></div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn" style="background-color: var(--accent);">Save my RSVP</button>
      </div>
    </form>

    <p style="text-align: center; color: var(--muted); margin-top: 1.5rem; font-size: 0.9rem;">
      Questions? Contact the couple directly.
    </p>
  </div>
</div>

<div class="wh-toasts" id="toasts"></div>

<script>
const sb = window.supabase.createClient(
  window.WEDDING_HUB.SUPABASE_URL,
  window.WEDDING_HUB.SUPABASE_ANON_KEY
);

// Simple date formatter since we can't import formatDate
function formatDate(date, format = 'short') {
  const d = new Date(date);
  if (format === 'long') {
    return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }
  return d.toLocaleDateString('en-US');
}

let weddingData = null;
let guestData = {};

function toast(msg, type = 'info') {
  const toasts = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = `wh-toast wh-toast--${type}`;
  el.textContent = msg;
  toasts.append(el);
  setTimeout(() => {
    el.classList.add('is-out');
    setTimeout(() => el.remove(), 300);
  }, 4000);
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

async function loadInvitation() {
  try {
    console.log('loadInvitation called');
    const code = localStorage.getItem('guestCode');
    const inviteId = localStorage.getItem('guestInvite');
    console.log('Code:', code, 'InviteId:', inviteId);

    if (!code || !inviteId) {
      showError('Invalid invitation. Please try again.');
      return;
    }

    // Get current session
    const { data: { session }, error: sessionError } = await sb.auth.getSession();
    if (sessionError || !session) {
      showError('Session error. Please sign in again.');
      return;
    }

    // Load invite + wedding + guests using security-definer function
    const { data: rsvpData, error: rsvpError } = await sb.rpc('guest_load_rsvp', {
      p_invite_id: inviteId
    });

    if (rsvpError || !rsvpData) {
      showError('Invitation not found.');
      return;
    }

    const invite = rsvpData.invite;
    const wedding = rsvpData.wedding;
    const guests = rsvpData.guests || [];

    weddingData = wedding;

    // Update header
    document.getElementById('weddingCouple').textContent = `${wedding.partner_a} & ${wedding.partner_b}`;
    document.getElementById('weddingDate').textContent = formatDate(wedding.wedding_date, 'long');
    document.getElementById('headerSubtitle').textContent = `${invite.household_name}`;

    // For now, use hardcoded options - will add dynamic loading after confirming this works
    const mealOptions = ['Beef', 'Salmon', 'Vegetarian'];

    // Render guest list
    const guestList = document.getElementById('guestList');
    guestList.innerHTML = '';

    if (guests && guests.length > 0) {
      guests.forEach(guest => {
        const guestRow = document.createElement('div');
        guestRow.className = 'guest-row';

        guestData[guest.id] = {
          rsvp_status: guest.rsvp_status || 'pending',
          meal_choice: guest.meal_choice || '',
          dietary: guest.dietary || ''
        };

        const mealOptionsHtml = mealOptions.map(option =>
          `<option value="${option}" ${guest.meal_choice === option ? 'selected' : ''}>${option}</option>`
        ).join('');

        guestRow.innerHTML = `
          <div class="guest-name">${guest.full_name}</div>
          <div class="guest-status">
            <label>
              <input type="radio" name="status_${guest.id}" value="attending"
                     ${guest.rsvp_status === 'attending' ? 'checked' : ''}>
              Coming
            </label>
            <label>
              <input type="radio" name="status_${guest.id}" value="declined"
                     ${guest.rsvp_status === 'declined' ? 'checked' : ''}>
              Not coming
            </label>
            <label>
              <input type="radio" name="status_${guest.id}" value="pending"
                     ${!guest.rsvp_status || guest.rsvp_status === 'pending' ? 'checked' : ''}>
              Maybe
            </label>
          </div>
          <div class="meal-choice" style="display: ${guest.rsvp_status === 'attending' ? 'block' : 'none'}">
            <label class="lbl" for="meal_${guest.id}">Meal choice</label>
            <select id="meal_${guest.id}" class="in" data-guest-id="${guest.id}">
              <option value="">Choose an option</option>
              ${mealOptionsHtml}
            </select>
          </div>
          <div class="dietary">
            <label class="lbl" for="dietary_${guest.id}">Dietary requirements</label>
            <textarea id="dietary_${guest.id}" class="in" data-guest-id="${guest.id}"
                      placeholder="Any allergies or dietary needs?">${guest.dietary || ''}</textarea>
          </div>
        `;

        // Show/hide meal choice based on status
        const statusRadios = guestRow.querySelectorAll(`input[name="status_${guest.id}"]`);
        const mealDiv = guestRow.querySelector('.meal-choice');
        statusRadios.forEach(radio => {
          radio.addEventListener('change', (e) => {
            if (mealDiv) {
              mealDiv.style.display = e.target.value === 'attending' ? 'block' : 'none';
            }
          });
        });

        guestList.append(guestRow);
      });
    }

    document.getElementById('loadingView').style.display = 'none';
    document.getElementById('contentView').style.display = 'block';

  } catch (err) {
    showError(err.message || 'Error loading invitation');
  }
}

document.getElementById('rsvpForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  try {
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    const inviteId = localStorage.getItem('guestInvite');
    const guestRows = document.querySelectorAll('.guest-row');
    const guestsData = [];

    for (const row of guestRows) {
      const guestIdEl = row.querySelector('[data-guest-id]');
      if (!guestIdEl) continue;

      const guestId = guestIdEl.dataset.guestId;
      const status = row.querySelector(`input[name="status_${guestId}"]:checked`)?.value || 'pending';
      const meal = row.querySelector(`#meal_${guestId}`)?.value || null;
      const dietary = row.querySelector(`#dietary_${guestId}`)?.value || null;

      guestsData.push({
        id: guestId,
        rsvp_status: status,
        meal_choice: meal,
        dietary: dietary
      });
    }

    // Use security-definer function to submit RSVP
    const { data, error } = await sb.rpc('guest_submit_rsvp', {
      p_invite_id: inviteId,
      p_guests: guestsData
    });

    if (error) throw error;

    toast('RSVP saved! Thank you.', 'success');
    btn.disabled = false;
    btn.textContent = 'Save my RSVP';

  } catch (err) {
    toast('Error saving RSVP: ' + (err.message || 'Unknown error'), 'error');
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = false;
    btn.textContent = 'Save my RSVP';
  }
});

// Handle redirect from email link - populate localStorage from URL params
window.addEventListener('load', async () => {
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const inviteId = params.get('invite');

  if (code && inviteId) {
    localStorage.setItem('guestCode', code);
    localStorage.setItem('guestInvite', inviteId);
  }

  loadInvitation();
});
</script>

</body>
</html>
