<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password — Join Us For</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/assets/admin.css?v=400">
<script src="/config.js"></script>
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .reset-wrapper { width: min(100% - 2rem, 28rem); }
</style>
</head>
<body>

<div class="reset-wrapper">
  <div class="panel">
    <h1 style="margin: 0 0 0.35rem; font-size: 1.25rem" id="title">Reset your password</h1>
    <p class="panel__sub" style="margin-bottom: 1.5rem" id="subtitle">
      Enter your email and we'll send you a link to set a new one.
    </p>

    <div id="loadingView">
      <p style="text-align: center; color: var(--muted)">Checking your link…</p>
    </div>

    <!-- Step 1: ask for a reset link -->
    <div id="requestView" hidden>
      <form id="requestForm" style="display: grid; gap: 1.5rem;">
        <div class="fld">
          <label class="lbl" for="email">Email address</label>
          <input class="in" type="email" id="email" required autocomplete="email"
                 placeholder="you@example.com">
        </div>
        <button class="btn" style="width: 100%" type="submit" id="requestBtn">Send reset link</button>
        <p class="hint" id="requestMsg" style="display: none;"></p>
      </form>
      <p class="hint" style="margin-top: 1.5rem; text-align: center; font-size: 0.82rem;">
        <a href="/admin/venue-settings.html">Back to sign in</a>
      </p>
    </div>

    <!-- Step 2: arrived from the email, choose a new password -->
    <div id="setView" hidden>
      <form id="setForm" style="display: grid; gap: 1.5rem;">
        <div class="fld">
          <label class="lbl" for="password">New password</label>
          <input class="in" type="password" id="password" required minlength="6"
                 autocomplete="new-password" placeholder="At least 6 characters">
        </div>
        <div class="fld">
          <label class="lbl" for="password2">Confirm new password</label>
          <input class="in" type="password" id="password2" required
                 autocomplete="new-password" placeholder="Confirm your password">
        </div>
        <button class="btn" style="width: 100%" type="submit" id="setBtn">Save new password</button>
        <p class="hint" id="setMsg" style="color: var(--danger); display: none;"></p>
      </form>
    </div>

    <div id="errorView" hidden>
      <p class="error" id="errorMsg"></p>
      <p class="hint" style="margin-top: 1.5rem; text-align: center; font-size: 0.82rem;">
        <a href="/admin/reset-password.html">Request a new link</a>
      </p>
    </div>
  </div>
</div>

<div class="wh-toasts" id="toasts"></div>

<script type="module">
import { sb, $, toast } from '/assets/app.js?v=20';

// Supabase drops the recovery token in the URL fragment and the client swaps it
// for a short-lived session. That happens asynchronously on load, so watch for
// the event as well as polling the session — whichever lands first wins.
let SETTLED = false;

// Someone invited to a venue who already had an account resets their password
// instead of setting one. The invite still has to be activated afterwards or
// they arrive with a working login and no venue attached to it, so the token
// rides along in the query string and is redeemed once the password is saved.
const INVITE_TOKEN = new URLSearchParams(location.search).get('invite');

(async function boot() {
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));

  // An expired or already-used link comes back as an error in the fragment
  // rather than a session, and would otherwise just look like a dead page.
  const hashError = hash.get('error_description') || hash.get('error');
  if (hashError) return showError(decodeURIComponent(hashError.replace(/\+/g, ' ')));

  const isRecovery = hash.get('type') === 'recovery'
                  || hash.has('access_token')
                  || new URLSearchParams(location.search).has('code');

  if (!isRecovery) return showRequest();

  sb.auth.onAuthStateChange((event, session) => {
    if (session && !SETTLED) showSet();
  });

  const { data: { session } } = await sb.auth.getSession();
  if (session) return showSet();

  // Give the client a moment to finish consuming the fragment before giving up.
  setTimeout(async () => {
    if (SETTLED) return;
    const { data: { session: late } } = await sb.auth.getSession();
    if (late) return showSet();
    showError('This reset link has expired or has already been used. Request a new one below.');
  }, 2500);
})();

async function showRequest() {
  SETTLED = true;
  $('#loadingView').hidden = true;
  $('#requestView').hidden = false;

  // Arriving here from an invite, the address is already known — asking them to
  // retype it invites a typo that silently sends the link nowhere.
  if (INVITE_TOKEN) {
    const { data } = await sb.rpc('venue_invite_check', { p_token: INVITE_TOKEN });
    if (data?.email) {
      $('#email').value = data.email;
      $('#subtitle').textContent = 'You already have an account with this address. '
        + 'Send yourself a link to set a new password and finish joining '
        + (data.venue_name || 'your venue') + '.';
    }
  }

  $('#requestForm').addEventListener('submit', async e => {
    e.preventDefault();
    await sendResetLink();
  });
}

function showSet() {
  if (SETTLED) return;
  SETTLED = true;
  $('#loadingView').hidden = true;
  $('#requestView').hidden = true;
  $('#setView').hidden = false;
  $('#title').textContent = 'Choose a new password';
  $('#subtitle').textContent = 'Pick something you will remember. This replaces your old password.';
  $('#setForm').addEventListener('submit', async e => {
    e.preventDefault();
    await saveNewPassword();
  });
}

function showError(text) {
  SETTLED = true;
  $('#loadingView').hidden = true;
  $('#errorMsg').textContent = text;
  $('#errorView').hidden = false;
}

async function sendResetLink() {
  const email = $('#email').value.trim();
  const btn = $('#requestBtn');
  const msg = $('#requestMsg');

  if (!email) return;

  btn.disabled = true;
  btn.textContent = 'Sending…';
  msg.style.display = 'none';

  // The token has to survive the trip out to the mailbox and back.
  const back = new URL('/admin/reset-password.html', location.origin);
  if (INVITE_TOKEN) back.searchParams.set('invite', INVITE_TOKEN);

  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: back.toString()
  });

  btn.disabled = false;
  btn.textContent = 'Send reset link';
  msg.style.display = 'block';

  if (error) {
    msg.style.color = 'var(--danger)';
    msg.textContent = error.message;
    return;
  }

  // Deliberately the same answer whether or not the address has an account —
  // otherwise this page becomes a way to test which emails are registered.
  msg.style.color = 'var(--accent)';
  msg.textContent = 'If that address has an account, a reset link is on its way. '
                  + 'It is valid for one hour.';
}

async function saveNewPassword() {
  const password = $('#password').value;
  const password2 = $('#password2').value;
  const btn = $('#setBtn');
  const msg = $('#setMsg');

  if (password !== password2) {
    msg.textContent = 'Passwords do not match';
    msg.style.display = 'block';
    return;
  }
  if (password.length < 6) {
    msg.textContent = 'Password must be at least 6 characters';
    msg.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Saving…';
  msg.style.display = 'none';

  const { error } = await sb.auth.updateUser({ password });

  if (error) {
    btn.disabled = false;
    btn.textContent = 'Save new password';
    msg.textContent = error.message;
    msg.style.display = 'block';
    return;
  }

  let destination = '/admin/';

  if (INVITE_TOKEN) {
    const { data: { user } } = await sb.auth.getUser();
    const { data: activated } = await sb.rpc('venue_invite_activate', {
      p_token: INVITE_TOKEN, p_user_id: user?.id
    });
    // A stale token is not worth blocking on — the password change succeeded,
    // and venue staff can re-send the invite.
    if (activated?.success) destination = '/admin/venue-settings.html';
  }

  toast('Password updated. Signing you in…', 'success');
  setTimeout(() => { window.location.href = destination; }, 800);
}
</script>
</body>
</html>
