<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Venues — Join Us For Owner</title>
<link rel="stylesheet" href="/assets/admin.css?v=400">
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="top">
  <div class="top__in">
    <span class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21l8.8-8.3a5 5 0 0 0 0-7.1z"/>
      </svg>
      Join Us For
    </span>
    <span class="muted" id="whoami" style="font-size:.82rem;white-space:nowrap;margin-left:auto"></span>
    <button class="btn btn--ghost btn--sm" id="signOut">Sign out</button>
  </div>
</header>

<main class="shell">
  <div style="display:flex;align-items:center;gap:1rem;margin:2rem 0">
    <h1 style="margin:0;font-size:1.5rem">Venues</h1>
    <button class="btn" id="newVenueBtn" style="margin-left:auto">+ Add venue</button>
  </div>

  <!-- Create Venue Form -->
  <div class="panel" id="createVenuePanel" hidden>
    <h2 class="panel__title">Create new venue</h2>
    <form id="createVenueForm" style="display:grid;gap:1.5rem">
      <div class="fld">
        <label class="lbl" for="venueName">Venue name</label>
        <input class="in" id="venueName" required placeholder="e.g. The Manor House">
      </div>
      <div class="fld">
        <label class="lbl" for="venueEmail">Invite staff email</label>
        <input class="in" type="email" id="venueEmail" required placeholder="staff@venue.com">
      </div>
      <div class="row" style="gap:1rem">
        <button class="btn" type="submit">Create & invite</button>
        <button class="btn btn--ghost" type="button" id="cancelVenue">Cancel</button>
      </div>
    </form>
  </div>

  <!-- Venues List -->
  <div id="venuesList"></div>
</main>

<div class="wh-toasts" id="toasts"></div>

<script type="module">
import { sb, $, $$, el, toast } from '/assets/app.js?v=20';

let USER = null;

(async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = '/admin/owner/';
    return;
  }

  USER = session.user;
  $('#whoami').textContent = USER.email;

  // Check if user is owner
  const { data: roles } = await sb
    .from('memberships')
    .select('role')
    .eq('user_id', USER.id);

  if (!roles || !roles.some(r => r.role === 'owner')) {
    await sb.auth.signOut();
    window.location.href = '/admin/owner/';
    return;
  }

  // Load venues
  await loadVenues();

  // Wire up form
  $('#newVenueBtn').onclick = () => {
    $('#createVenuePanel').hidden = false;
    $('#venueName').focus();
  };

  $('#cancelVenue').onclick = () => {
    $('#createVenuePanel').hidden = true;
    $('#createVenueForm').reset();
  };

  $('#createVenueForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    await createVenue();
  });

  $('#signOut').onclick = () => sb.auth.signOut().then(() => location.href = '/admin/owner/');
})();

async function loadVenues() {
  const { data: venues, error } = await sb
    .from('venues')
    .select('id, name, created_at')
    .order('created_at', { ascending: false });

  if (error) {
    toast('Error loading venues', 'error');
    return;
  }

  const list = $('#venuesList');
  list.innerHTML = '';

  if (!venues.length) {
    list.append(el('p', { class: 'empty', text: 'No venues yet. Create one to get started.' }));
    return;
  }

  for (const venue of venues) {
    // Get staff count
    const { count: staffCount } = await sb
      .from('memberships')
      .select('*', { count: 'exact', head: true })
      .eq('venue_id', venue.id)
      .eq('role', 'venue');

    // Get pending invites
    const { count: pendingCount } = await sb
      .from('venue_invites')
      .select('*', { count: 'exact', head: true })
      .eq('venue_id', venue.id)
      .is('activated_at', null);

    const card = el('div', { class: 'panel' },
      el('div', { style: 'display:flex;align-items:center;gap:1rem;margin-bottom:1rem' },
        el('div', { style: 'flex:1' },
          el('h3', { style: 'margin:0;font-size:1.1rem', text: venue.name }),
          el('p', { class: 'panel__sub', style: 'margin:.5rem 0 0', text: `${staffCount} staff${pendingCount ? ` • ${pendingCount} pending invite${pendingCount > 1 ? 's' : ''}` : ''}` })
        ),
        el('div', { style: 'display:flex;gap:.5rem' },
          el('button', { class: 'btn btn--ghost btn--sm', type: 'button', text: 'Invite staff',
                         onclick: () => showInviteDialog(venue) }),
          el('button', { class: 'btn btn--danger btn--sm', type: 'button', text: 'Delete',
                         onclick: () => deleteVenue(venue) })
        )
      )
    );

    list.append(card);
  }
}

async function createVenue() {
  const name = $('#venueName').value.trim();
  const email = $('#venueEmail').value.trim();

  if (!name || !email) return;

  const btn = document.querySelector('#createVenueForm button[type="submit"]');
  btn.disabled = true;
  btn.textContent = 'Creating…';

  try {
    // Generate slug from venue name
    const slug = name.toLowerCase()
      .replace(/&/g, ' and ')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/-{2,}/g, '-')
      .replace(/^-+|-+$/g, '');

    // Create venue
    const { data: venue, error: venueError } = await sb
      .from('venues')
      .insert({ name, slug, website: null })
      .select()
      .single();

    if (venueError) throw venueError;

    // Someone who already has a login does not need an invite — an invite asks
    // them to choose a password they already have. Link them to the venue and
    // tell them they can sign in with what they've got.
    const { data: existing, error: existingError } = await sb
      .rpc('add_existing_user_to_venue', {
        p_venue_id: venue.id,
        p_email: email
      });

    if (existingError) throw existingError;
    if (existing?.error) throw new Error(existing.error);

    if (existing?.found) {
      const { error: welcomeError } = await sb.rpc('send_added_to_venue_email', {
        p_email: email,
        p_venue_name: name
      });

      if (welcomeError) console.error('Welcome email error:', welcomeError);

      toast(`${email} already had an account and now has access to ${name}. `
          + `They sign in with their existing password.`, 'success');

      $('#createVenuePanel').hidden = true;
      $('#createVenueForm').reset();
      btn.disabled = false;
      btn.textContent = 'Create & invite';
      await loadVenues();
      return;
    }

    // Create invite
    const { data: inviteData, error: inviteError } = await sb
      .rpc('create_venue_invite', {
        p_venue_id: venue.id,
        p_email: email
      });

    if (inviteError) throw inviteError;

    if (inviteData.error) {
      toast(inviteData.error, 'error');
      btn.disabled = false;
      btn.textContent = 'Create & invite';
      return;
    }

    // Send email with invite link
    const { error: emailError } = await sb.rpc('send_invite_email', {
      p_email: email,
      p_venue_name: name,
      p_invite_token: inviteData.token
    });

    if (emailError) {
      console.error('Email send error:', emailError);
      toast(`Venue created but email failed to send. Invite token: ${inviteData.token}`, 'error');
      return;
    }

    toast(`Venue created and invite email sent to ${email}`, 'success');

    $('#createVenuePanel').hidden = true;
    $('#createVenueForm').reset();
    btn.disabled = false;
    btn.textContent = 'Create & invite';

    await loadVenues();
  } catch (err) {
    toast(err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Create & invite';
  }
}

async function showInviteDialog(venue) {
  const email = prompt(`Invite email for ${venue.name}:`);
  if (!email) return;

  try {
    // As with venue creation: an existing account gets access directly rather
    // than an invite it cannot complete.
    const { data: existing } = await sb.rpc('add_existing_user_to_venue', {
      p_venue_id: venue.id,
      p_email: email
    });

    if (existing?.found) {
      const { error: welcomeError } = await sb.rpc('send_added_to_venue_email', {
        p_email: email,
        p_venue_name: venue.name
      });
      if (welcomeError) console.error('Welcome email error:', welcomeError);

      toast(`${email} already had an account and now has access to ${venue.name}.`, 'success');
      await loadVenues();
      return;
    }

    const { data, error } = await sb.rpc('create_venue_invite', {
      p_venue_id: venue.id,
      p_email: email
    });

    if (error || data.error) {
      toast(data?.error || error?.message, 'error');
      return;
    }

    // Send email with invite link
    const { error: emailError } = await sb.rpc('send_invite_email', {
      p_email: email,
      p_venue_name: venue.name,
      p_invite_token: data.token
    });

    if (emailError) {
      console.error('Email send error:', emailError);
      toast(`Invite created but email failed to send. Token: ${data.token}`, 'error');
      return;
    }

    toast(`Invite email sent to ${email}`, 'success');
    await loadVenues();
  } catch (err) {
    toast(err.message, 'error');
  }
}

async function deleteVenue(venue) {
  const confirmed = confirm(`Delete "${venue.name}" and all its data? This cannot be undone.`);
  if (!confirmed) return;

  try {
    const { data, error } = await sb.rpc('delete_venue_completely', {
      p_venue_id: venue.id
    });

    if (error || !data?.ok) {
      toast(data?.message || error?.message || 'Failed to delete venue', 'error');
      return;
    }

    toast(`Venue "${venue.name}" deleted successfully`, 'success');
    await loadVenues();
  } catch (err) {
    toast(err.message, 'error');
  }
}
</script>

</body>
</html>
